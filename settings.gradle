pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }
        gradlePluginPortal()
        mavenCentral()
    }

    plugins {
        id 'net.fabricmc.fabric-loom' version '1.17.19'
    }
}

rootProject.name = 'blockpedia-exporter'
