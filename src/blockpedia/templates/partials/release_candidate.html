{% set already_built = run.get('boundary_event') == 'RELEASE_BUILT' and run.get('status') == 'succeeded' %}
<section class="work-card" data-release-candidate data-build-complete="{{ 'true' if already_built else 'false' }}" data-run-id="{{ run_identifier }}" data-minecraft-version="{{ run.get('minecraft_version') }}" aria-labelledby="candidate-heading">
  <div class="section-heading"><div><p class="section-index">RELEASE / BUILD</p><h2 id="candidate-heading">构建候选发布</h2></div></div>
  <p class="supporting-copy">将已完成审核的工作区构建为不可变发布。构建完成后，再确认对外发布。</p>
  <div class="form-action"><button class="button button--primary" type="button" data-candidate-build {% if already_built %}disabled{% endif %}>{{ '查看本次构建结果' if already_built else '构建候选' }}</button><button class="text-button" type="button" data-new-build>开始新的构建操作</button></div>
  <p role="status" aria-live="polite" data-build-feedback>{{ '该运行已构建候选。可前往发布与回滚查看已有结果，或明确开始新的构建操作。' if already_built else '准备构建。' }}</p>
  <a class="arrow-link" href="/releases?minecraft_version={{ run.get('minecraft_version') }}">前往发布与回滚 →</a>
</section>
